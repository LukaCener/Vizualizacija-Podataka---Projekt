                        .style("grid-template-columns", "auto 1fr auto")
                        .style("gap", "10px")
                        .style("align-items", "center");

                    // Determine winner and loser details
                    const isWinnerPlayer1 = final.Winner === final.Player_1;
                    const winnerRank = isWinnerPlayer1 ? final.Rank_1 : final.Rank_2;
                    const loserRank = isWinnerPlayer1 ? final.Rank_2 : final.Rank_1;
                    const loserName = isWinnerPlayer1 ? final.Player_2 : final.Player_1;

                    // Format score
                    const scores = final.Score.split(' ');
                    const formattedScores = scores.map(score => {
                        const [p1Score, p2Score] = score.split('-').map(s => s || '0');
                        return isWinnerPlayer1 ? [p1Score, p2Score] : [p2Score, p1Score];
                    });

                    winnerDiv.append("div")
                        .html(`Rank ${winnerRank}`);
                    
                    winnerDiv.append("div")
                        .style("font-weight", "bold")
                        .text(final.Winner);

                    winnerDiv.append("div")
                        .text(formattedScores.map(s => s[0]).join(' '));

                    winnerDiv.append("div")
                        .html(`Rank ${loserRank}`);
                        
                    winnerDiv.append("div")
                        .text(loserName);

                    winnerDiv.append("div")
                        .text(formattedScores.map(s => s[1]).join(' '));
                }

                // Biggest upset
                const upsets = tournamentMatches.map(match => {
                    const isWinnerPlayer1 = match.Winner === match.Player_1;
                    const winnerRank = +(isWinnerPlayer1 ? match.Rank_1 : match.Rank_2);
                    const loserRank = +(isWinnerPlayer1 ? match.Rank_2 : match.Rank_1);
                    
                    if (winnerRank > loserRank) {
                        return {
                            match,
                            rankDiff: winnerRank - loserRank,
                            isWinnerPlayer1
                        };
                    }
                    return null;
                }).filter(u => u !== null)
                  .sort((a, b) => b.rankDiff - a.rankDiff);

                if (upsets.length > 0) {
                    const biggestUpset = upsets[0];
                    const match = biggestUpset.match;
                    
                    innerContainer.append("div")
                        .style("margin", "15px 0")
                        .html(`<strong>Biggest Upset (${match.Round}):</strong>`);

                    const upsetDiv = innerContainer.append("div")
                        .style("margin", "5px 30px 0 0")
                        .style("display", "grid")
                        .style("grid-template-columns", "auto 1fr auto")
                        .style("gap", "10px")
                        .style("align-items", "center");

                    // Format score for upset match
                    const scores = match.Score.split(' ');
                    const formattedScores = scores.map(score => {
                        const [p1Score, p2Score] = score.split('-').map(s => s || '0');
                        return biggestUpset.isWinnerPlayer1 ? [p1Score, p2Score] : [p2Score, p1Score];
                    });

                    const isWinnerPlayer1 = biggestUpset.isWinnerPlayer1;
                    const winnerRank = isWinnerPlayer1 ? match.Rank_1 : match.Rank_2;
                    const loserRank = isWinnerPlayer1 ? match.Rank_2 : match.Rank_1;
                    const loserName = isWinnerPlayer1 ? match.Player_2 : match.Player_1;

                    upsetDiv.append("div")
                        .html(`Rank ${winnerRank}`);
                    
                    upsetDiv.append("div")
                        .style("font-weight", "bold")
                        .text(match.Winner);

                    upsetDiv.append("div")
                        .text(formattedScores.map(s => s[0]).join(' '));

                    upsetDiv.append("div")
                        .html(`Rank ${loserRank}`);
                        
                    upsetDiv.append("div")
                        .text(loserName);

                    upsetDiv.append("div")
                        .text(formattedScores.map(s => s[1]).join(' '));
                }
            });

            // Function to switch between tournaments
            function switchTournament(direction) {
                const sections = sectionsContainer.selectAll(".tournament-section");
                const upButton = container.select(".chart-button.up");
                const downButton = container.select(".chart-button.down");
                
                let activeIndex = 0;
                sections.each(function(d, i) {
                    if (d3.select(this).classed("active")) {
                        activeIndex = i;
                    }
                });

                const totalSections = tournaments.length;
                let newIndex;

                if (direction === "up") {
                    newIndex = activeIndex - 1;
                } else {
                    newIndex = activeIndex + 1;
                }

                if (newIndex >= 0 && newIndex < totalSections) {
                    sections.each(function(d, i) {
                        const section = d3.select(this);
                        if (i < newIndex) section.classed("above", true).classed("active below", false);
                        else if (i === newIndex) section.classed("active", true).classed("above below", false);
                        else section.classed("below", true).classed("active above", false);
                    });

                    // Update button visibility
                    upButton.classed("hidden", newIndex === 0);
                    downButton.classed("hidden", newIndex === totalSections - 1);
                }
            }

            // Fade in the container
            container.transition()
                .duration(500)
                .style("opacity", 1);
        }

        // Function to update tournament markers based on selected year
        function updateTournamentMarkers(selectedYear, tournaments) {
            // Filter tournaments by year
            const filteredTournaments = tournaments.filter(d => new Date(d.Date).getFullYear() === selectedYear);

            // Group matches by tournament
            const tournamentMatches = d3.group(filteredTournaments, d => d.Tournament);

            // Normalize coordinates to 4 decimal places to handle minor variations
            const normalizeCoords = coords => [
                Math.round(coords[0] * 10000) / 10000,
                Math.round(coords[1] * 10000) / 10000
            ];

            // Aggregate tournaments by city and normalized coordinates
            const cityCounts = d3.rollup(
                filteredTournaments,
                v => {
                    const uniqueTournaments = Array.from(new Set(v.map(t => t.Tournament.trim())))
                        .map(tournament => {
                            const tournamentData = v.find(d => d.Tournament === tournament);
                            return {
                                Tournament: tournament,
                                City: tournamentData.City.trim(),
                                Country: tournamentData.Country,
                                Series: tournamentData.Series,
                                Surface: tournamentData.Surface,
                                Court: tournamentData.Court,
                                Coordinates: tournamentData.Coordinates,
                                matches: Array.from(tournamentMatches.get(tournament))
                            };
                        });
                    const coords = JSON.parse(v[0].Coordinates.replace(/'/g, '"'));
                    return {
                        count: uniqueTournaments.length,
                        tournaments: uniqueTournaments,
                        coords: normalizeCoords(coords),
                        city: v[0].City.trim()
                    };
                },
                d => {
                    const coords = JSON.parse(d.Coordinates.replace(/'/g, '"'));
                    return `${d.City.trim()}_${normalizeCoords(coords).join(',')}`;
                }
            );

            // Convert to array for D3 binding
            const cityData = Array.from(cityCounts, ([key, data]) => ({
                city: data.city,
                count: data.count,
                tournaments: data.tournaments,
                coords: data.coords
            }));

            // Color mapping for series
            const seriesColors = {
                "Grand Slam": "#FFD700",
                "ATP Finals": "#C0C0C0",
                "ATP Masters 1000": "#00008B",
                "ATP Tour 500": "#006400",
                "ATP Tour 250": "#FC3D3D"
            };

            // Darker shades for hover
            const hoverColors = {
                "Grand Slam": "#DAA520",
                "ATP Finals": "#8F8F8F",
                "ATP Masters 1000": "#000066",
                "ATP Tour 500": "#004d00",
                "ATP Tour 250": "#C22F2F"
            };

            // Update marker groups (circle + optional text)
            const markerGroups = g.selectAll("g.tournament-marker-group")
                .data(cityData, d => `${d.city}_${d.coords.join(',')}`);

            const markerEnter = markerGroups.enter()
                .append("g")
                .attr("class", "tournament-marker-group");

            // Append circles with enter animation
            markerEnter.append("circle")
                .attr("class", "tournament-marker")
                .attr("cx", d => projection([d.coords[0], d.coords[1]])[0])
                .attr("cy", d => projection([d.coords[0], d.coords[1]])[1])
                .attr("r", 0)
                .attr("fill", d => d.count >= 2 ? "#000000" : seriesColors[d.tournaments[0].Series] || "#B9B28A")
                .on("click", (event, d) => {
                    event.stopPropagation();
                    zoomToMarker(d);
                    displayTournamentInfo(d.tournaments, selectedYear);
                })
                .on("mouseover", function(event, d) {
                    d3.select(this)
                        .transition()
                        .duration(200)
                        .ease(d3.easeQuadInOut)
                        .attr("r", 13 / Math.max(1/3, Math.min(8, currentTransform.k)))
                        .attr("fill", d.count >= 2 ? "#333333" : hoverColors[d.tournaments[0].Series] || "#d5cf9e");
                    
                    if (d.count >= 2) {
                        d3.select(this.parentNode).select("text.tournament-marker-text")
                            .transition()
                            .duration(200)
                            .ease(d3.easeQuadInOut)
                            .attr("font-size", 17 / Math.max(1/3, Math.min(8, currentTransform.k)));
                    }

                    // Show tooltip with tournament information
                    const tooltipContent = d.count >= 2 
                        ? `<strong>${d.city}</strong><br>${Array.from(new Set(d.tournaments.map(t => t.Tournament))).join('<br>')}`
                        : `<strong>${d.city}</strong><br>${d.tournaments[0].Tournament}`;

                    tooltip.transition()
                        .duration(200)
                        .style("opacity", 1);
                    tooltip.html(tooltipContent)
                        .style("left", (event.pageX + 10) + "px")
                        .style("top", (event.pageY - 10) + "px");
                })
                .on("mousemove", function(event) {
                    tooltip.style("left", (event.pageX + 10) + "px")
                        .style("top", (event.pageY - 10) + "px");
                })
                .on("mouseout", function(event, d) {
                    d3.select(this)
                        .transition()
                        .duration(200)
                        .ease(d3.easeQuadInOut)
                        .attr("r", 10 / Math.max(1/3, Math.min(8, currentTransform.k)))
                        .attr("fill", d.count >= 2 ? "#000000" : seriesColors[d.tournaments[0].Series] || "#B9B28A");
                    
                    if (d.count >= 2) {
                        d3.select(this.parentNode).select("text.tournament-marker-text")
                            .transition()
                            .duration(200)
                            .ease(d3.easeQuadInOut)
                            .attr("font-size", 14 / Math.max(1/3, Math.min(8, currentTransform.k)));
                    }

                    tooltip.transition()
                        .duration(500)
                        .style("opacity", 0);
                })
                .transition()
                .duration(500)
                .ease(d3.easeQuadInOut)
                .attr("r", 10 / Math.max(1/3, Math.min(8, currentTransform.k)));

            // Append text for new markers with 2+ tournaments
            markerEnter.filter(d => d.count >= 2)
                .append("text")
                .attr("class", "tournament-marker-text")
                .attr("x", d => projection([d.coords[0], d.coords[1]])[0])
                .attr("y", d => projection([d.coords[0], d.coords[1]])[1])
                .attr("dy", "0.3em")
                .text(d => d.count)
                .attr("font-size", 0)
                .style("cursor", "pointer")
                .on("click", (event, d) => {
                    event.stopPropagation();
                    zoomToMarker(d);
                    displayTournamentInfo(d.tournaments, selectedYear);
                })
                .transition()
                .duration(500)
                .ease(d3.easeQuadInOut)
                .attr("font-size", 14 / Math.max(1/3, Math.min(8, currentTransform.k)));

            // Update existing markers
            markerGroups.select("circle.tournament-marker")
                .transition()
                .duration(500)
                .ease(d3.easeQuadInOut)
                .attr("cx", d => projection([d.coords[0], d.coords[1]])[0])
                .attr("cy", d => projection([d.coords[0], d.coords[1]])[1])
                .attr("r", 10 / Math.max(1/3, Math.min(8, currentTransform.k)))
                .attr("fill", d => d.count >= 2 ? "#000000" : seriesColors[d.tournaments[0].Series] || "#B9B28A");

            // Handle text for existing markers
            markerGroups.each(function(d) {
                const group = d3.select(this);
                const hasText = !group.select("text.tournament-marker-text").empty();
                
                if (d.count >= 2) {
                    // Create or update text for count >= 2
                    let text = group.select("text.tournament-marker-text");
                    if (text.empty()) {
                        text = group.append("text")
                            .attr("class", "tournament-marker-text")
                            .attr("x", projection([d.coords[0], d.coords[1]])[0])
                            .attr("y", projection([d.coords[0], d.coords[1]])[1])
                            .attr("dy", "0.3em")
                            .attr("font-size", 0)
                            .text(d.count);
                    }
                    text.transition()
                        .duration(500)
                        .ease(d3.easeQuadInOut)
                        .attr("x", projection([d.coords[0], d.coords[1]])[0])
                        .attr("y", projection([d.coords[0], d.coords[1]])[1])
                        .attr("font-size", 14 / Math.max(1/3, Math.min(8, currentTransform.k)))
                        .text(d.count);
                } else {
                    // Remove text for count < 2
                    group.select("text.tournament-marker-text")
                        .transition()
                        .duration(500)
                        .ease(d3.easeQuadInOut)
                        .attr("font-size", 0)
                        .remove();
                }
            });

            // Add click handler to existing text elements
            markerGroups.selectAll("text.tournament-marker-text")
                .style("cursor", "pointer")
                .on("click", (event, d) => {
                    event.stopPropagation();
                    zoomToMarker(d);
                    displayTournamentInfo(d.tournaments, selectedYear);
            });

            // Exit transitions
            markerGroups.exit()
                .select("circle.tournament-marker")
                .transition()
                .duration(500)
                .ease(d3.easeQuadInOut)
                .attr("r", 0)
                .remove();

            markerGroups.exit()
                .select("text.tournament-marker-text")
                .transition()
                .duration(500)
                .ease(d3.easeQuadInOut)
                .attr("font-size", 0)
                .remove();

            markerGroups.exit()
                .transition()
                .duration(500)
                .remove();

            // Update click handlers
            svg.on("click", function(event) {
                if (event.target.tagName === "svg") {
                    // Clicked on map background, show year info
                    updateInfoSection(selectedYear);
                }
            });
        }

        // Load world map and tournament data
        Promise.all([
            d3.json("https://cdn.jsdelivr.net/npm/world-atlas@2/countries-110m.json"),
            atp_tennis_fixed
        ]).then(function([world, tournaments]) {
            // Create tooltip div if it doesn't exist
            const tooltip = d3.select("body").selectAll(".tooltip").data([0])
                .join("div")
                .attr("class", "tooltip");

            // Draw the map
            g.selectAll("path")
                .data(topojson.feature(world, world.objects.countries).features)
                .enter()
                .append("path")
                .attr("class", "country")
                .attr("d", path)
                .on("mouseover", function(event, d) {
                    d3.select(this)
                        .transition()
                        .duration(200)
                        .style("fill", "#d5cf9e");
                    
                    tooltip.transition()
                        .duration(200)
                        .style("opacity", 1);
                    tooltip.html(d.properties.name)
                        .style("left", (event.pageX + 10) + "px")
                        .style("top", (event.pageY - 10) + "px");
                })
                .on("mousemove", function(event) {
                    tooltip.style("left", (event.pageX + 10) + "px")
                        .style("top", (event.pageY - 10) + "px");
                })
                .on("mouseout", function() {
                    d3.select(this)
                        .transition()
                        .duration(200)
                        .style("fill", "#EBE5C2");
                    
                    tooltip.transition()
                        .duration(500)
                        .style("opacity", 0);
                })
                .on("click", (event, d) => {
                    event.stopPropagation();
                    zoomToCountry(d, path);
                });

            // Initial rendering of tournament markers for 2009
            updateTournamentMarkers(2009, tournaments);

            // Store tournaments globally for timeline updates
            window.tournamentsData = tournaments;

            // Initialize info section with default year
            updateInfoSection(2009);
        });

        function updateVisualization(selectedYear) {
            // Update year labels
            d3.selectAll(".year-label")
                .classed("active", d => d === selectedYear);

            // Update tournament markers
            updateTournamentMarkers(selectedYear, window.tournamentsData);

            // Update info section
            updateInfoSection(selectedYear);
        }
    </script>

    <script>
        const timelineContainer = d3.select("#timeline-container");
        const timelineWidth = 85;
        const timelineHeight = window.innerHeight - 77;

        const svgTimeline = timelineContainer.append("svg")
            .attr("id", "timeline-svg")
            .attr("width", timelineWidth)
            .attr("height", timelineHeight)
            .style("display", "block");

        const allYears = d3.range(2009, 2026);
        let selectedYear = 2009;
        const visibleCount = 9;
        const circleSpacing = 50;
        const transitionDuration = 350;
        let previousVisibleYears = allYears.slice(0, visibleCount);

        function renderTimelineSVG(centerYear) {
            const centerIndex = allYears.indexOf(centerYear);
            const half = Math.floor(visibleCount / 2);
            let startIdx = Math.max(0, centerIndex - half);
            let endIdx = Math.min(allYears.length, startIdx + visibleCount);

            if (endIdx - startIdx < visibleCount) {
                startIdx = Math.max(0, endIdx - visibleCount);
            }

            const visibleYears = allYears.slice(startIdx, endIdx);

            // Calculate shift direction and magnitude
            const previousCenterIndex = allYears.indexOf(previousVisibleYears[Math.floor(visibleCount / 2)]);
            const shiftDelta = centerIndex - previousCenterIndex;
            const shiftDirection = shiftDelta > 0 ? 1 : -1;

            const centerY = timelineHeight / 2;
            const timelineGroup = svgTimeline.selectAll("g.timeline-group")
                .data([null])
                .join(
                    enter => enter.append("g")
                        .attr("class", "timeline-group")
                        .attr("transform", `translate(75, ${centerY - (visibleYears.length - 1) * circleSpacing / 2})`),
                    update => update
                        .transition()
                        .duration(transitionDuration)
                        .ease(d3.easeCubicInOut)
                        .attr("transform", `translate(75, ${centerY - (visibleYears.length - 1) * circleSpacing / 2})`)
                );

            // Create defs for fade gradients
            if (svgTimeline.select("defs").empty()) {
                const defs = svgTimeline.append("defs");

                const topFadeGradient = defs.append("linearGradient")
                    .attr("id", "topFadeOverlay")
                    .attr("x1", "0%")
                    .attr("y1", "0%")
                    .attr("x2", "0%")
                    .attr("y2", "100%");

                topFadeGradient.append("stop")
                    .attr("offset", "0%")
                    .attr("stop-color", "#C2DFFF")
                    .attr("stop-opacity", 1);

                topFadeGradient.append("stop")
                    .attr("offset", "100%")
                    .attr("stop-color", "#C2DFFF")
                    .attr("stop-opacity", 0);

                const bottomFadeGradient = defs.append("linearGradient")
                    .attr("id", "bottomFadeOverlay")
                    .attr("x1", "0%")
                    .attr("y1", "0%")
                    .attr("x2", "0%")
                    .attr("y2", "100%");

                bottomFadeGradient.append("stop")
                    .attr("offset", "0%")
                    .attr("stop-color", "#C2DFFF")
                    .attr("stop-opacity", 0);

                bottomFadeGradient.append("stop")
                    .attr("offset", "100%")
                    .attr("stop-color", "#C2DFFF")
                    .attr("stop-opacity", 1);
            }

            // Update line with transition
            timelineGroup.selectAll("line")
                .data([null])
                .join(
                    enter => enter.append("line")
                        .attr("x1", 0)
                        .attr("x2", 0)
                        .attr("y1", visibleYears[0] === 2009 ? 0 : -circleSpacing)
                        .attr("y2", visibleYears[8] === 2025 ? (visibleYears.length - 1) * circleSpacing : visibleYears.length * circleSpacing)
                        .attr("stroke", "#504B38")
                        .attr("stroke-width", 4),
                    update => update
                        .transition()
                        .duration(transitionDuration)
                        .ease(d3.easeCubicInOut)
                        .attr("y1", visibleYears[0] === 2009 ? 0 : -circleSpacing)
                        .attr("y2", visibleYears[8] === 2025 ? (visibleYears.length - 1) * circleSpacing : visibleYears.length * circleSpacing)
                );

            // Update circles with transition
            const circles = timelineGroup.selectAll("circle")
                .data(visibleYears, d => d);

            circles.join(
                enter => enter.append("circle")
                    .attr("cx", 0)
                    .attr("cy", (d, i) => {
                        const finalY = i * circleSpacing;
                        const offset = shiftDirection * circleSpacing * Math.max(1, Math.abs(shiftDelta));
                        return finalY + offset;
                    })
                    .attr("r", 0)
                    .attr("fill", d => d === selectedYear ? "#B9B28A" : "#504B38")
                    .attr("class", "timeline-circle")
                    .on("click", (event, d) => {
                        selectedYear = d;
                        renderTimelineSVG(d);
                        updateVisualization(d);
                    })
                    .transition()
                    .duration(transitionDuration)
                    .ease(d3.easeCubicInOut)
                    .attr("cy", (d, i) => i * circleSpacing)
                    .attr("r", d => d === selectedYear ? 10 : 8)
                    .attr("fill", d => d === selectedYear ? "#B9B28A" : "#504B38"),
                update => update
                    .transition()
                    .duration(transitionDuration)
                    .ease(d3.easeCubicInOut)
                    .attr("cy", (d, i) => i * circleSpacing)
                    .attr("r", d => d === selectedYear ? 10 : 8)
                    .attr("fill", d => d === selectedYear ? "#B9B28A" : "#504B38"),
                exit => exit
                    .transition()
                    .duration(350)
                    .ease(d3.easeQuadInOut)
                    .attr("cy", (d, i) => {
                        const finalY = i * circleSpacing;
                        const offset = -shiftDirection * circleSpacing * Math.max(1, Math.abs(shiftDelta));
                        return finalY + offset;
                    })
                    .attr("r", 0)
                    .remove()
            );

            // Update text labels with smooth transition
            const texts = timelineGroup.selectAll("text")
                .data(visibleYears, d => d);

            texts.join(
                enter => enter.append("text")
                    .attr("x", -15)
                    .attr("y", (d, i) => {
                        const finalY = i * circleSpacing + 6.5;
                        const offset = shiftDirection * circleSpacing * Math.max(1, Math.abs(shiftDelta));
                        return finalY + offset;
                    })
                    .attr("opacity", 0)
                    .attr("fill", d => d === selectedYear ? "#B9B28A" : "#504B38")
                    .style("font-size", d => d === selectedYear ? "22px" : "19px")
                    .attr("class", d => d === selectedYear ? "year-label active" : "year-label")
                    .text(d => d)
                    .on("click", (event, d) => {
                        selectedYear = d;
                        renderTimelineSVG(d);
                        updateVisualization(d);
                    })
                    .transition()
                    .duration(transitionDuration)
                    .ease(d3.easeCubicInOut)
                    .attr("y", (d, i) => i * circleSpacing + 6.5)
                    .attr("opacity", 1)
                    .attr("fill", d => d === selectedYear ? "#B9B28A" : "#504B38")
                    .style("font-size", d => d === selectedYear ? "22px" : "19px"),
                update => update
                    .transition()
                    .duration(transitionDuration)
                    .ease(d3.easeCubicInOut)
                    .attr("y", (d, i) => i * circleSpacing + 6.5)
                    .attr("fill", d => d === selectedYear ? "#B9B28A" : "#504B38")
                    .style("font-size", d => d === selectedYear ? "22px" : "19px")
                    .attr("class", d => d === selectedYear ? "year-label active" : "year-label")
                    .attr("opacity", 1),
                exit => exit
                    .transition()
                    .duration(transitionDuration)
                    .ease(d3.easeCubicInOut)
                    .attr("y", (d, i) => {
                        const finalY = i * circleSpacing + 6.5;
                        const offset = -shiftDirection * circleSpacing * Math.max(1, Math.abs(shiftDelta));
                        return finalY + offset;
                    })
                    .attr("opacity", 0)
                    .remove()
            );

            // Update fade overlay rectangles
            const fadeHeight = (visibleCount - 1) * circleSpacing * 0.12;

            timelineGroup.selectAll("rect.top-fade")
                .data([null])
                .join(
                    enter => enter.append("rect")
                        .attr("class", "top-fade")
                        .attr("x", -100)
                        .attr("y", -circleSpacing - 1)
                        .attr("width", 150)
                        .attr("height", fadeHeight)
                        .attr("fill", visibleYears[0] === 2009 ? "none" : "url(#topFadeOverlay)")
                        .attr("pointer-events", "none"),
                    update => update
                        .transition()
                        .duration(transitionDuration)
                        .ease(d3.easeCubicInOut)
                        .attr("fill", "url(#topFadeOverlay)")
                );

            timelineGroup.selectAll("rect.bottom-fade")
                .data([null])
                .join(
                    enter => enter.append("rect")
                        .attr("class", "bottom-fade")
                        .attr("x", -100)
                        .attr("y", visibleCount * circleSpacing - fadeHeight)
                        .attr("width", 150)
                        .attr("height", fadeHeight)
                        .attr("fill", visibleYears[8] === 2025 ? "none" : "url(#bottomFadeOverlay)")
                        .attr("pointer-events", "none"),
                    update => update
                        .transition()
                        .duration(transitionDuration)
                        .ease(d3.easeCubicInOut)
                        .attr("fill", "url(#bottomFadeOverlay)")
                );

            // Update previousVisibleYears
            previousVisibleYears = visibleYears;
        }

        renderTimelineSVG(selectedYear);
    </script>
</body>
</html>
